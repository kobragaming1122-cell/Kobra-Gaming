<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple to-do list that saves tasks in your browser." />
    <title>TaskFlow | To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app" aria-labelledby="page-title">
      <header class="app-header">
        <p class="eyebrow">Kobra Gaming</p>
        <h1 id="page-title">TaskFlow</h1>
        <p class="subtitle">Keep your day moving, one task at a time.</p>
      </header>

      <section class="todo-panel" aria-label="To-do list">
        <form id="todo-form" class="add-form">
          <label class="sr-only" for="todo-input">Add a task</label>
          <input id="todo-input" name="task" type="text" placeholder="What needs to be done?" maxlength="120" autocomplete="off" required />
          <button type="submit">Add task</button>
        </form>

        <div class="toolbar">
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
          </div>
          <button id="clear-completed" class="text-button" type="button">Clear completed</button>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
        <p id="empty-state" class="empty-state">No tasks here yet. Add one to get started!</p>

        <footer class="list-footer">
          <span id="task-count">0 tasks left</span>
          <button id="clear-all" class="text-button danger" type="button">Clear all</button>
        </footer>
      </section>

      <p class="storage-note">Your tasks are saved automatically in this browser.</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
