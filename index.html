<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app" aria-labelledby="page-title">
      <p class="eyebrow">Kobra Gaming</p>
      <h1 id="page-title">Random Joke Generator</h1>
      <p class="intro">Need a quick laugh? Fetch a family-friendly joke from the JokeAPI.</p>

      <section class="joke-card" aria-live="polite" aria-atomic="true">
        <p id="status" class="status">Press the button to get a joke.</p>
        <p id="setup" class="joke-text"></p>
        <p id="delivery" class="joke-text"></p>
      </section>

      <button id="new-joke" type="button">Tell me a joke</button>
      <p id="error" class="error" role="alert" hidden></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
